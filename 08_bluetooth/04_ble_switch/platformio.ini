; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;-----------------------------------------------------------------------------
; The project was successfully compiled with version 55.03.36 of the
; pioarduino-espressif32 platform released on January 21, 2026.
; This was tested using the pioarduinoIDE extension (v1.2.5) which is a fork
; of the PlatformioIDE extension. It is available in the Visual Studio Code
; marketplace and in the VSCodium marketplace. The sketch was tested
; using VSCodium (Version 1.108.10359).                       Feburary 10, 2026
;-----------------------------------------------------------------------------

[platformio]
default_envs = seeed_xiao_esp32c5
;default_envs = seeed_xiao_esp32c6
;default_envs = seeed_xiao_esp32c3
;default_envs = lolin32_lite   

; Make the Arduino IDE happy (.INO file must be in a directory of the same name)
src_dir = ble_switch
boards_dir = ../../boards 
lib_dir = ../../libraries 

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
;build_flags = 
;  -UBOARD_HAS_PSRAM    ; disable PSRAM
;  -DCORE_DEBUG_LEVEL=0 ; options: 5 verbose, 4 debug, 3 info, 2 error, 1 critical, 0 none (default)

[env:seeed_xiao_esp32c5]
; Bluetooth: BLE v5.3
board = seeed_xiao_esp32c5
monitor_speed = 460800
;upload_port = /dev/ttyACM0
;monitor_port = /dev/ttyACM0

[env:seeed_xiao_esp32c6]
; Bluetooth: BLE v5.3
board = seeed_xiao_esp32c6
monitor_speed = 460800

[env:seeed_xiao_esp32c3]
; Bluetooth: BLE v5.0
board = seeed_xiao_esp32c3
monitor_speed = 460800

[env:lolin32_lite]
; Bluetooth: BR/EDR + BLE v4.2
board = lolin32_lite
monitor_speed = 115200
build_flags = 
  -DBUTTON_PIN=14
  -DBLE_V4
;upload_port = /dev/ttyUSB0
;monitor_port = /dev/ttyUSB0

; About Bluetooth capabilities:
;  ESP Product Selector @ https://products.espressif.com/#/product-selector?language=en&names=
; Use the Bluetooth filter 
;  [] Bluetooth LE V5.0 (v5.3 certified) to find ESP32-C5 and ESP32-C6
;  [] Bluetooth LE v5.0 to find ESP32-C3 and 
;  [] BR/EDR + Bluetooth LE v4.2 to find ESP32-D0WDQ6 and ESP32-D0WD-V3
;       "WEMOS LOLIN32 Lite is a compact development board based on ESP32-D0WDQ6 or ESP32-D0WD-V3 chips."
;       source: https://docs.zephyrproject.org/latest/boards/wemos/lolin32_lite/doc/index.html
;  
