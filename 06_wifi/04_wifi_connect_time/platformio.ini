; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;-----------------------------------------------------------------------------
; The sketch was successfully compiled with version 55.03.36 of the
; pioarduino-espressif32 platform released on January 21, 2026 using the 
; proposed XIAO ESP32C5 board definition in the ../../boards directory.
; This was tested using the pioarduinoIDE extension (v1.2.5) which is a fork
; of the PlatformioIDE extension. It is available in the Visual Studio Code
; marketplace and in the VSCodium marketplace. The sketch was tested
; using VSCodium (Version 1.108.10359).                           Feb 1, 2026
;-----------------------------------------------------------------------------

[platformio]
default_envs = seeed_xiao_esp32c5
;default_envs = seeed_xiao_esp32c6

; Make the Arduino IDE happy (.INO file must be in a directory of the same name)
src_dir = wifi_connect_time
boards_dir = ../../boards
lib_dir = ../../libraries

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
;upload_port = /dev/ttyACM0
;monitor_port = /dev/ttyACM0
monitor_speed = 460800

[env:seeed_xiao_esp32c5]
board = seeed_xiao_esp32c5

[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6

